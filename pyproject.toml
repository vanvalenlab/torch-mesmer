[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=61.2']

[project]
name = 'torch-mesmer'
description = 'Deep learning for single-cell image segmentation'
readme = 'README.md'
requires-python = '>=3.10'
dynamic = ['version']
keywords = [
    'cell segmentation',
    'single-cell imaging',
    'multiplexed',
    'deep learning',
    'torch',
    'pytorch',
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: Apache Version 2',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3 :: Only',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Scientific/Engineering :: Single-cell Imaging',
    'Topic :: Scientific/Engineering :: Microscopy',
    'Topic :: Scientific/Engineering :: Deep Learning',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Topic :: Scientific/Engineering :: Image Analysis',
]
dependencies = [
    "ipython",
    "matplotlib",
    "opencv-python-headless",
    "scikit-image",
    "scipy",
    "torch",
    "torchvision",
    "tqdm",
    "zarr>=3",
    "pandas",
    "tensorboard",
    "huggingface_hub"
]

[[project.authors]]
name = 'Van Valen Lab'
email = 'vanvalenlab@gmail.com'

[[project.maintainers]]
name = 'Van Valen Lab'
email = 'vanvalenlab@gmail.com'

[project.urls]
# Homepage = 
"Bug Tracker" = 'https://github.com/vanvalenlab/torch-mesmer/issues'
# Documentation =
"Source Code" = 'https://github.com/vanvalenlab/torch-mesmer'

[project.optional-dependencies]
eval = [
    "deepcell-toolbox"
]
test = [
    "pytest"
]
doc = [
    "sphinx",  # Doc generation
    "pydata-sphinx-theme",  # HTML theme
    "numpydoc",  # Docstring format theme
    "myst-nb",  # text-based jupyter notebooks
    # The following dependencies are required to run the executable tutorials
    "s3fs",
    "napari",
    "pyqt6",
]

[tool.setuptools]
include-package-data = false
packages = ["torch_mesmer"]
platforms = [
    'Linux',
    'Mac OSX',
    'Windows',
    'Unix',
]

[tool.setuptools.package-data]
torch_mesmer = ['tests/*.py']

[tool.setuptools.dynamic.version]
attr = 'torch_mesmer.__version__'

# [tool.setuptools.package-data]
# torch_mesmer = ['tests/*.py']

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the TissueNet v1.1 test split at ~/.deepcell/tissuenet_v1-1/test.zarr (skipped if missing)",
    "slow: builds the full PanopticNet on CPU (a few seconds)",
    "golden: Mesmer.predict with the released weights vs tests/data/golden_masks.npz (~3 min on CPU); deselected by default, run with -m golden",
]
addopts = "-m 'not golden'"
xfail_strict = true
filterwarnings = [
    # Noise from the reference checkouts (loaded by tests/_reference.py) and from
    # inside third-party libraries. Warnings raised by torch_mesmer itself stay visible.
    "ignore::FutureWarning:deepcell_toolbox",
    "ignore::FutureWarning:_ref_transform_utils",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    "ignore:_pytest.python.CallSpec2 has been renamed",
]

[tool.ruff]
line-length = 110
target-version="py310"

[tool.ruff.lint]
exclude = ["*.ipynb"]
select = ["E", "F", "UP"]
